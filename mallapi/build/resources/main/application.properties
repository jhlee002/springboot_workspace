spring.application.name=mallapi

#포트번호변경
server.port=80

#Mariadb DBCP연결
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/malldb
spring.datasource.username=malldbuser
spring.datasource.password=malldbuser

#SQL DDL문 자동생성.
spring.jpa.hibernate.ddl-auto=update

#로그에 변환된 Native Query 자세히 출력
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# thuymleaf cache사용안함
spring.thymeleaf.cache=false 

# 파일업로드 관련 설정
# spring.servlet.multipart.enabled=true
# spring.servlet.multipart.location=C:\\upload
# spring.servlet.multipart.max-request-size=30MB
# spring.servlet.multipart.max-file-size=10MB

# 파일업로드폴더경로 변수(?)에 저장
org.zerock.upload.path =C:\\upload

